name: DevOps + GenAI Lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests and capture trace
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          test_exit=${PIPESTATUS[0]}
          exit "$test_exit"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error

  ai_debugger:
    name: ai_debugger
    needs: unit_test
    if: ${{ always() && needs.unit_test.result == 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download failed test log
        uses: actions/download-artifact@v8
        with:
          name: pytest-log
          path: artifacts

      - name: Analyze failure with GenAI and comment on PR
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_LOG_PATH: artifacts/pytest.log
        run: python genai_analyst.py
